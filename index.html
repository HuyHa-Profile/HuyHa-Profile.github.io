<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nguyễn Huy Hà</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d1675; --ink:#02040f; --paper:#f2f0ff; --sun:#ffd84a;--hd:#fff; --mute:rgba(242,240,255,.62); --line:rgba(242,240,255,.28);
  --font:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0}
body{min-height:100%;background:radial-gradient(ellipse at 50% 50%,var(--bg) 0%,var(--ink) 78%) fixed;color:var(--paper);font-family:var(--font);overflow-x:hidden;position:relative}
#galaxy{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
main{position:relative;min-height:100svh;display:flex;flex-direction:column;justify-content:space-between;padding:clamp(20px,4vw,48px);gap:40px;max-width:1400px;margin:0 auto}
header{display:flex;align-items:center;gap:12px}
.logo{display:flex;align-items:center;gap:10px;color:var(--paper);text-decoration:none;font-weight:700;font-size:1.25rem;letter-spacing:-.01em;font-variation-settings:"wdth" 90}
.badge{width:44px;height:44px;border-radius:12px;background:#fff;box-shadow:0 2px 10px rgba(10,16,51,.25);display:grid;place-items:center;flex:none}
.badge img{width:28px;height:auto;display:block}
h1{text-shadow:var(--ts,0 2px 18px rgba(4,6,26,.6));font-size:clamp(1.7rem,10vw,9.5rem);line-height:.95;letter-spacing:-.035em;font-weight:600;display:flex;justify-content:center;align-items:center;text-align:center;flex:0 0 auto;padding:1vh 0}
.line{display:block;white-space:nowrap}
.ch{display:inline-block;font-variation-settings:"wght" 560,"wdth" 88;animation:rise .9s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*45ms + 150ms);will-change:transform}
.ch.sp{width:.26em}
@keyframes rise{from{transform:translateY(70%) rotate(4deg);opacity:0}to{transform:none;opacity:1}}
nav{max-width:760px;width:100%;margin:auto auto 0;display:flex;flex-direction:column;gap:14px}
.row{position:relative;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 22px 12px 12px;border:1.5px solid var(--line);border-radius:22px;background:color-mix(in srgb,var(--paper) 6%,transparent);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);color:var(--paper);text-decoration:none;font-size:clamp(1.15rem,2.6vw,1.6rem);font-weight:800;letter-spacing:.005em;overflow:hidden;isolation:isolate;animation:fade .7s ease both;animation-delay:calc(var(--r)*70ms + 900ms);transition:color .25s,padding .35s cubic-bezier(.2,.8,.2,1),border-color .35s ease}
.row::before{content:"";position:absolute;inset:0;background:rgba(255,255,255,.07);background:linear-gradient(100deg,color-mix(in srgb,var(--c,#fff) 26%,transparent),color-mix(in srgb,var(--c,#fff) 4%,transparent) 72%);-webkit-backdrop-filter:blur(8px) saturate(1.4);backdrop-filter:blur(8px) saturate(1.4);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14);opacity:0;transition:opacity .45s ease;z-index:-1}
.rain{position:absolute;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.m{position:absolute;left:var(--x);top:var(--y);width:var(--len);height:14px;opacity:0;transform:rotate(var(--a)) translateX(0);filter:drop-shadow(0 0 4px var(--c,#fff))}
.m::before{content:"";position:absolute;left:0;right:6px;top:50%;height:2px;margin-top:-1px;border-radius:2px;background:linear-gradient(90deg,transparent,var(--c,#fff))}
.m::after{content:"";position:absolute;right:0;top:50%;width:14px;height:14px;margin-top:-7px}
.row .h{font-size:.82em;color:var(--mute);font-weight:600;margin-left:auto;transition:color .25s}
.row .ic{box-sizing:border-box;width:48px;height:48px;padding:9px;border:2.6px solid currentColor;border-radius:15px;flex:none;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.row .arr{width:22px;height:22px;flex:none;stroke:currentColor;fill:none;stroke-width:2;transition:transform .4s cubic-bezier(.2,.8,.2,1)}
.row:hover,.row:focus-visible{padding-left:20px;border-color:color-mix(in srgb,var(--c) 75%,transparent)}
.row:hover::before,.row:focus-visible::before{opacity:1}
.fx-facebook .m::after{width:18px;height:18px;margin-top:-9px;right:-3px;background:var(--hd);clip-path:polygon(50% 0,58% 42%,100% 50%,58% 58%,50% 100%,42% 58%,0 50%,42% 42%)}
.fx-tiktok .m::after{width:17px;height:17px;margin-top:-8.5px;right:-3px;background:radial-gradient(circle,var(--hd) 22%,var(--c) 85%);clip-path:polygon(50% 0,66% 34%,100% 50%,66% 66%,50% 100%,34% 66%,0 50%,34% 34%)}
.fx-youtube .m::after{width:24px;height:24px;margin-top:-12px;right:-5px;background:var(--hd);clip-path:polygon(50% 0,54% 45%,100% 50%,54% 55%,50% 100%,46% 55%,0 50%,46% 45%);transform:rotate(45deg)}
.fx-zalo .m::after{width:19px;height:19px;margin-top:-9.5px;right:-3px;background:linear-gradient(90deg,var(--hd),var(--c) 50%,var(--hd));clip-path:polygon(50% 0,60% 40%,100% 50%,60% 60%,50% 100%,40% 60%,0 50%,40% 40%)}
.fx-zalo:hover .m::after,.fx-zalo:focus-visible .m::after{animation:pulse .7s ease-in-out infinite alternate}
.s{position:absolute;left:var(--sx);top:calc(50% + var(--sy));width:var(--ss);height:var(--ss);margin:calc(var(--ss)/-2) 0 0 calc(var(--ss)/-2);background:var(--hd);clip-path:polygon(50% 0,60% 40%,100% 50%,60% 60%,50% 100%,40% 60%,0 50%,40% 40%);opacity:0}
.row:hover .s,.row:focus-visible .s{animation:tw var(--st,.9s) ease-in-out var(--sd,0s) infinite}
@keyframes tw{0%,100%{opacity:0;transform:scale(.3) rotate(0)}50%{opacity:1;transform:scale(1) rotate(90deg)}}
@keyframes pulse{from{transform:scale(.75)}to{transform:scale(1.2)}}
.row:hover .m,.row:focus-visible .m{animation:fall calc(var(--dur,2.6s)*var(--k,1)) linear var(--dl,0s) infinite}
@keyframes fall{0%{opacity:0;transform:rotate(var(--a)) translateX(0)}15%{opacity:1}80%{opacity:1}100%{opacity:0;transform:rotate(var(--a)) translateX(var(--dist,360px))}}
.row:hover .arr,.row:focus-visible .arr{transform:rotate(45deg)}
.row span{display:inline-block}
.row{--a:155deg}.fx-facebook{--c:#7aa2ff;--bc:#1877f2;--dur:2.8s}.fx-tiktok{--c:#ff4f8b;--bc:#111;--bb:#25f4ee;--dur:2.3s}.fx-youtube{--c:#ff5a4a;--bc:#f00;--dur:3.4s}.fx-zalo{--c:#4cc3ff;--bc:#0068ff;--dur:3s}
.row .ic{transition:transform .55s cubic-bezier(.22,1,.36,1),filter .55s ease,border-radius .55s ease,background-color .4s ease,border-color .4s ease,color .4s ease,box-shadow .4s ease}
.row:hover .ic,.row:focus-visible .ic{background:var(--bc);border-color:var(--bb,var(--bc));color:#fff;box-shadow:0 0 20px color-mix(in srgb,var(--bb,var(--bc)) 70%,transparent)}
.fx-facebook:hover .ic,.fx-facebook:focus-visible .ic{transform:translateY(-3px) scale(1.1)}
.fx-tiktok:hover .ic,.fx-tiktok:focus-visible .ic{transform:translateX(4px) rotate(-6deg);filter:drop-shadow(-3px 0 0 rgba(0,242,234,.85)) drop-shadow(3px 0 0 rgba(254,44,85,.9))}
.fx-youtube:hover .ic,.fx-youtube:focus-visible .ic{border-radius:50%;animation:beat 1.6s ease-in-out infinite}
.fx-zalo:hover .ic,.fx-zalo:focus-visible .ic{transform:rotate(-10deg) scale(1.08)}
.fx-zalo span{transition:letter-spacing .4s cubic-bezier(.2,.8,.2,1)}
.fx-zalo:hover span,.fx-zalo:focus-visible span{letter-spacing:.09em}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.row:focus-visible,.logo:focus-visible{outline:2px solid var(--paper);outline-offset:3px}
@keyframes fade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media (max-width:560px){.row .arr{display:none}.row .h{font-size:.74em}}
.row .h{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (prefers-reduced-motion:reduce){.ch,.row,.row .ic,.row span{animation:none!important}.rain{display:none}.row,.row::before,.row svg{transition:none}}
</style>
</head>
